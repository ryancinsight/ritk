# Serve the packaged app on loopback using the macOS system HTTP server.
# Both directories belong to the ephemeral test job.
ServerRoot "/usr"
LoadModule mpm_prefork_module libexec/apache2/mod_mpm_prefork.so
LoadModule unixd_module libexec/apache2/mod_unixd.so
LoadModule authz_core_module libexec/apache2/mod_authz_core.so
LoadModule dir_module libexec/apache2/mod_dir.so
LoadModule mime_module libexec/apache2/mod_mime.so

ServerName 127.0.0.1
Listen 127.0.0.1:17823
DefaultRuntimeDir "${RITK_HTTP_RUNTIME}"
PidFile "${RITK_HTTP_RUNTIME}/safari-http.pid"
ErrorLog "${RITK_HTTP_RUNTIME}/safari-http.log"
DocumentRoot "${RITK_WEB_BUNDLE}"
<Directory />
    Require all denied
</Directory>
<Directory "${RITK_WEB_BUNDLE}">
    Options None
    AllowOverride None
    Require all granted
</Directory>
DirectoryIndex index.html
TypesConfig /etc/apache2/mime.types
AddType application/wasm .wasm
AddType text/javascript .js
