<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 952 340">
<rect width="952" height="340" fill="#f8fafc"/>
<style>.panel{fill:#fff;stroke:#cbd5e1}.title{font:600 15px sans-serif;fill:#172033}.label{font:600 12px sans-serif;fill:#172033}.small{font:11px sans-serif;fill:#475569}.metric{font:13px sans-serif;fill:#172033}.success{font:600 13px sans-serif;fill:#047857}.arrow{fill:none;stroke:#0f766e;stroke-width:2}</style>
<g transform="translate(0,0)">
<rect x="7" y="7" width="224" height="266" class="panel"/>
<text x="17" y="29" class="title">Source z = 2</text>
<text x="17" y="46" class="small">third slice in [z, y, x]</text>
<image x="29" y="57" width="180" height="180" href="data:image/png;base64," image-rendering="pixelated"/>
<text x="17" y="259" class="small">display range [0, 1300]</text></g>
<g transform="translate(238,0)">
<rect x="7" y="7" width="224" height="266" class="panel"/>
<text x="17" y="29" class="title">Decoded page 3</text>
<text x="17" y="46" class="small">IFD page 3 maps to z = 2</text>
<image x="29" y="57" width="180" height="180" href="data:image/png;base64," image-rendering="pixelated"/>
<text x="17" y="259" class="small">same display range</text></g>
<g transform="translate(476,0)">
<rect x="7" y="7" width="224" height="266" class="panel"/>
<text x="17" y="29" class="title">Bitwise difference</text>
<text x="17" y="46" class="small">red would mark a mismatch</text>
<image x="29" y="57" width="180" height="180" href="data:image/png;base64," image-rendering="pixelated"/>
<text x="17" y="259" class="small">max |decoded − source| = 0</text></g>
<g transform="translate(714,0)">
<rect x="7" y="7" width="224" height="266" class="panel"/>
<text x="17" y="29" class="title">Metadata boundary</text>
<text x="17" y="55" class="label">Source geometry</text>
<text x="17" y="75" class="small">origin [10, −20, 30] mm</text>
<text x="17" y="92" class="small">spacing [0.5, 0.75, 2] mm</text>
<text x="17" y="109" class="small">direction: 90° axial rotation</text>
<path d="M119 121 v28 m0 0 l-7-9 m7 9 l7-9" class="arrow"/>
<text x="17" y="170" class="label">Decoded defaults</text>
<text x="17" y="190" class="small">origin [0, 0, 0]</text>
<text x="17" y="207" class="small">spacing [1, 1, 1]</text>
<text x="17" y="224" class="small">direction: identity</text>
<text x="17" y="253" class="small">file size: 82826 bytes</text></g>
<text x="18" y="302" class="success">Pixels and five-page order are exact; physical geometry is intentionally reset at this TIFF boundary.</text>
<text x="18" y="325" class="metric">Shape [5, 64, 64] · Gray32Float pages · one IFD per z-slice · page 1 → z=0, page 3 → z=2, page 5 → z=4</text></svg>
