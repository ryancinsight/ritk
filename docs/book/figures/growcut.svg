<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 276">
<style>.title{font:600 15px sans-serif;fill:#172033}.subtitle{font:11px sans-serif;fill:#475569}</style>
<g transform="translate(0,0)">
<rect width="240" height="276" fill="#ffffff" stroke="#cbd5e1"/>
<text x="120" y="21" text-anchor="middle" class="title">Input image</text>
<text x="120" y="39" text-anchor="middle" class="subtitle">two-tissue analytical phantom</text>
<image x="16" y="48" width="208" height="208" href="data:image/png;base64," image-rendering="pixelated"/>
</g>
<g transform="translate(240,0)">
<rect width="240" height="276" fill="#ffffff" stroke="#cbd5e1"/>
<text x="120" y="21" text-anchor="middle" class="title">Sparse seeds</text>
<text x="120" y="39" text-anchor="middle" class="subtitle">orange background; cyan target</text>
<image x="16" y="48" width="208" height="208" href="data:image/png;base64," image-rendering="pixelated"/>
</g>
<g transform="translate(480,0)">
<rect width="240" height="276" fill="#ffffff" stroke="#cbd5e1"/>
<text x="120" y="21" text-anchor="middle" class="title">Known truth</text>
<text x="120" y="39" text-anchor="middle" class="subtitle">circular target region</text>
<image x="16" y="48" width="208" height="208" href="data:image/png;base64," image-rendering="pixelated"/>
</g>
<g transform="translate(720,0)">
<rect width="240" height="276" fill="#ffffff" stroke="#cbd5e1"/>
<text x="120" y="21" text-anchor="middle" class="title">GrowCut result</text>
<text x="120" y="39" text-anchor="middle" class="subtitle">Dice = 1.000; errors = 0</text>
<image x="16" y="48" width="208" height="208" href="data:image/png;base64," image-rendering="pixelated"/>
</g>
</svg>
