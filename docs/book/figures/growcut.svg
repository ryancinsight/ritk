<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 456">
<style>.title{font:600 15px sans-serif;fill:#172033}.subtitle{font:11px sans-serif;fill:#475569}.explanation-title{font:600 16px sans-serif;fill:#172033}.explanation-heading{font:600 13px sans-serif;fill:#172033}.explanation{font:12px sans-serif;fill:#334155}.footer{font:600 12px sans-serif;fill:#172033}</style>
<g transform="translate(0,0)">
<rect width="240" height="286" fill="#ffffff" stroke="#cbd5e1"/>
<text x="120" y="21" text-anchor="middle" class="title">1. Plant sparse seeds</text>
<text x="120" y="39" text-anchor="middle" class="subtitle">orange = background; cyan = target</text>
<image x="16" y="58" width="208" height="208" href="data:image/png;base64," image-rendering="pixelated"/>
</g>
<g transform="translate(240,0)">
<rect width="240" height="286" fill="#ffffff" stroke="#cbd5e1"/>
<text x="120" y="21" text-anchor="middle" class="title">2. Grow for 8 sweeps</text>
<text x="120" y="39" text-anchor="middle" class="subtitle">4.7% labeled; grayscale is undecided</text>
<image x="16" y="58" width="208" height="208" href="data:image/png;base64," image-rendering="pixelated"/>
</g>
<g transform="translate(480,0)">
<rect width="240" height="286" fill="#ffffff" stroke="#cbd5e1"/>
<text x="120" y="21" text-anchor="middle" class="title">3. Compete at the edge</text>
<text x="120" y="39" text-anchor="middle" class="subtitle">41.2% labeled; fronts meet the edge</text>
<image x="16" y="58" width="208" height="208" href="data:image/png;base64," image-rendering="pixelated"/>
</g>
<g transform="translate(720,0)">
<rect width="240" height="286" fill="#ffffff" stroke="#cbd5e1"/>
<text x="120" y="21" text-anchor="middle" class="title">4. Stop when stable</text>
<text x="120" y="39" text-anchor="middle" class="subtitle">Dice = 1.000; errors = 0</text>
<image x="16" y="58" width="208" height="208" href="data:image/png;base64," image-rendering="pixelated"/>
</g>
<rect y="286" width="960" height="170" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="20" y="316" class="explanation-title">Why the colored fronts stop at the circular tissue edge</text>
<rect x="20" y="330" width="440" height="90" rx="8" fill="#ecfeff" stroke="#67e8f9"/>
<text x="36" y="353" class="explanation-heading">Within one tissue: the neighbor can win</text>
<text x="36" y="377" class="explanation">|0.85 - 0.85| = 0.00, so g = 1 - 0.00 / 0.70 = 1.00</text>
<text x="36" y="400" class="explanation">Attack = neighbor confidence x 1.00: its label can spread.</text>
<rect x="500" y="330" width="440" height="90" rx="8" fill="#fff7ed" stroke="#fdba74"/>
<text x="516" y="353" class="explanation-heading">Across the tissue edge: the attack is blocked</text>
<text x="516" y="377" class="explanation">|0.85 - 0.15| = 0.70, so g = 1 - 0.70 / 0.70 = 0.00</text>
<text x="516" y="400" class="explanation">Attack = neighbor confidence x 0.00 = 0: it cannot cross.</text>
<text x="20" y="440" class="footer">Each synchronous sweep lets orange and cyan attack adjacent voxels; every voxel keeps the strongest successful attack.</text>
</svg>
