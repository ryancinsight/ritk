<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 245">
<style>.title{font:600 15px sans-serif;fill:#172033}.subtitle{font:11px sans-serif;fill:#475569}</style>
<g transform="translate(0,0)">
<rect width="210" height="245" fill="#ffffff" stroke="#cbd5e1"/>
<text x="105" y="21" text-anchor="middle" class="title">Input mask</text>
<text x="105" y="38" text-anchor="middle" class="subtitle">specks, spur, and holes</text>
<image x="17" y="48" width="176" height="176" href="data:image/png;base64," image-rendering="pixelated"/>
</g>
<g transform="translate(210,0)">
<rect width="210" height="245" fill="#ffffff" stroke="#cbd5e1"/>
<text x="105" y="21" text-anchor="middle" class="title">Opening</text>
<text x="105" y="38" text-anchor="middle" class="subtitle">erode then dilate</text>
<image x="17" y="48" width="176" height="176" href="data:image/png;base64," image-rendering="pixelated"/>
</g>
<g transform="translate(420,0)">
<rect width="210" height="245" fill="#ffffff" stroke="#cbd5e1"/>
<text x="105" y="21" text-anchor="middle" class="title">Opening change</text>
<text x="105" y="38" text-anchor="middle" class="subtitle">13 foreground voxels removed</text>
<image x="17" y="48" width="176" height="176" href="data:image/png;base64," image-rendering="pixelated"/>
</g>
<g transform="translate(630,0)">
<rect width="210" height="245" fill="#ffffff" stroke="#cbd5e1"/>
<text x="105" y="21" text-anchor="middle" class="title">Closing</text>
<text x="105" y="38" text-anchor="middle" class="subtitle">dilate then erode</text>
<image x="17" y="48" width="176" height="176" href="data:image/png;base64," image-rendering="pixelated"/>
</g>
<g transform="translate(840,0)">
<rect width="210" height="245" fill="#ffffff" stroke="#cbd5e1"/>
<text x="105" y="21" text-anchor="middle" class="title">Closing change</text>
<text x="105" y="38" text-anchor="middle" class="subtitle">4 background voxels filled</text>
<image x="17" y="48" width="176" height="176" href="data:image/png;base64," image-rendering="pixelated"/>
</g>
</svg>
