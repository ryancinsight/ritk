<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 952 340">
<rect width="952" height="340" fill="#f8fafc"/>
<style>.panel{fill:#fff;stroke:#cbd5e1}.title{font:600 15px sans-serif;fill:#172033}.label{font:600 12px sans-serif;fill:#172033}.small{font:11px sans-serif;fill:#475569}.metric{font:13px sans-serif;fill:#172033}.success{font:600 13px sans-serif;fill:#047857}.warning{font:600 11px sans-serif;fill:#b45309}</style>
<g transform="translate(0,0)">
<rect x="7" y="7" width="224" height="266" class="panel"/>
<text x="17" y="29" class="title">Source z = 2</text>
<text x="17" y="46" class="small">before file encoding</text>
<image x="29" y="57" width="180" height="180" href="data:image/png;base64," image-rendering="pixelated"/>
<text x="17" y="259" class="small">display range [0, 1100]</text></g>
<g transform="translate(238,0)">
<rect x="7" y="7" width="224" height="266" class="panel"/>
<text x="17" y="29" class="title">Decoded z = 2</text>
<text x="17" y="46" class="small">after .hdr/.img read</text>
<image x="29" y="57" width="180" height="180" href="data:image/png;base64," image-rendering="pixelated"/>
<text x="17" y="259" class="small">same display range</text></g>
<g transform="translate(476,0)">
<rect x="7" y="7" width="224" height="266" class="panel"/>
<text x="17" y="29" class="title">Absolute difference</text>
<text x="17" y="46" class="small">red would mark a mismatch</text>
<image x="29" y="57" width="180" height="180" href="data:image/png;base64," image-rendering="pixelated"/>
<text x="17" y="259" class="small">max |decoded − source| = 0</text></g>
<g transform="translate(714,0)">
<rect x="7" y="7" width="224" height="266" class="panel"/>
<text x="17" y="29" class="title">File pair + geometry</text>
<text x="17" y="57" class="label">phantom.hdr</text>
<text x="17" y="76" class="small">348 bytes · dimensions</text>
<text x="17" y="93" class="small">spacing · datatype · originator</text>
<text x="17" y="124" class="label">phantom.img</text>
<text x="17" y="143" class="small">65536 bytes · little-endian f32</text>
<text x="17" y="174" class="label">Round-trip geometry</text>
<text x="17" y="193" class="small">shape [4, 64, 64]</text>
<text x="17" y="210" class="small">spacing [2, 1.5, 0.75] mm</text>
<text x="17" y="227" class="small">origin [3, −4.5, 8] mm</text>
<text x="17" y="251" class="warning">direction is identity only</text></g>
<text x="18" y="302" class="success">The source and decoded slices are bit-identical; the difference panel is uniformly zero.</text>
<text x="18" y="325" class="metric">One 3-D volume · X-fastest payload · exact f32 values · trailing payload bytes rejected</text></svg>
