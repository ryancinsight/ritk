# Deliberately minimal. The API is `&[f32]` buffers plus dimensions and returns
# plain `f64` displacements, so it needs no image, tensor or backend crate.
# Consumers that only track speckle — kwavers' elastography among them — must be
# able to take this without inheriting a registration or tensor stack.
[dependencies]
anyhow = { workspace = true }
