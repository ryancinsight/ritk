[package]
name = "ritk-block-matching"
version = "0.1.0"
description = "Block-matching displacement estimation for speckle tracking"
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
repository.workspace = true
publish = true
edition = "2021"
license.workspace = true

# The API is `&[f32]` buffers plus dimensions and returns plain `f64`
# displacements, so it needs no image, tensor or registration crate. Consumers
# that only track speckle, kwavers' elastography among them, take it without
# inheriting that stack. The FFT metric uses Apollo's FFT provider, which brings
# the leto, moirai, hermes and mnemosyne compute crates but no image or tensor
# crate.
[dependencies]
anyhow = { workspace = true }
apollo-fft = { workspace = true }
eunomia = { workspace = true }
