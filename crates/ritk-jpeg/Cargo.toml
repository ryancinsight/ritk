tracing = { workspace = true }
coeus-core = { workspace = true }
consus-raster = { workspace = true }

[dev-dependencies]
# Rejection assertions shared across the workspace's test modules.
ritk-core = { path = "../ritk-core", features = ["test-helpers"] }
image = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
