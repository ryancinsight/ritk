[package]
name = "ritk-jpeg"
version = "0.2.0"
authors.workspace = true
repository.workspace = true
publish = true
edition = "2021"
license.workspace = true
description = "JPEG grayscale image I/O for RITK"
keywords.workspace = true
categories.workspace = true
homepage.workspace = true

[dependencies]
ritk-image = { path = "../ritk-image", version = "0.4.0" }
ritk-spatial = { path = "../ritk-spatial", version = "0.2.0" }
