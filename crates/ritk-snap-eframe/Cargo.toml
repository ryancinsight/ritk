[package]
name = "ritk-snap-eframe"
version = "0.1.0"
authors.workspace = true
repository.workspace = true
publish = false
edition = "2021"
description = "eframe compatibility shell for the RITK DICOM viewer"
license.workspace = true
readme = "README.md"

[[bin]]
name = "ritk-snap-eframe"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
ritk-snap = { path = "../ritk-snap", version = "0.1.0", features = ["eframe-shell"] }

[lints]
workspace = true
