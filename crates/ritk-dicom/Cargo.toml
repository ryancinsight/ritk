[package]
name = "ritk-dicom"
version = "0.2.0"
description = "DICOM image I/O and DIMSE networking for RITK"
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
repository.workspace = true
publish = true
edition = "2021"
license.workspace = true

[dependencies]
anyhow = { workspace = true }
arrayvec = { workspace = true }
dicom = { workspace = true }
ritk-codecs = { workspace = true }
ritk-diffusion-scheme = { path = "../ritk-diffusion-scheme", version = "0.2.0" }
ritk-spatial = { path = "../ritk-spatial", version = "0.2.0" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dicom-pixeldata = { workspace = true, features = ["native"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
dicom-pixeldata = { workspace = true }

[dev-dependencies]
image = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
