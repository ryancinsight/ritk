[package]
name = "ritk-snap"
version = "0.3.0"
authors.workspace = true
repository.workspace = true
publish = false
edition.workspace = true
description = "AsterSlice DICOM image viewer"
license.workspace = true

[lib]
name = "ritk_snap"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
eframe-shell = ["dep:eframe", "dep:egui", "dep:rfd"]

[[bin]]
name = "asterslice"
path = "src/main.rs"

[[example]]
name = "dicom_workflow"
required-features = ["eframe-shell"]

[dependencies]
aequitas.workspace = true
iris = { workspace = true, features = ["serde"] }
coeus-core = { workspace = true }
anyhow = { workspace = true }
arrayvec = { workspace = true }
clap = { workspace = true, features = ["derive"] }
ritk-core = { workspace = true }
ritk-annotation = { workspace = true }
ritk-image = { path = "../ritk-image", version = "0.6.0" }
ritk-spatial = { workspace = true }
ritk-filter = { workspace = true }
ritk-segmentation = { workspace = true }
ritk-io = { workspace = true }
ritk-vtk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
mnemosyne = { workspace = true }
tracing-subscriber = { workspace = true }
eframe = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
rfd = { workspace = true, optional = true }
image = { workspace = true }
gaia = { workspace = true }
walkdir = { workspace = true }
eunomia = { workspace = true }
moirai = { workspace = true }
metis-platform = { workspace = true }
metis-ui-lang = { workspace = true }
metis-web = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true }
pollster = { workspace = true }

# Select the native Metal backend for Apple viewer builds.
[target.'cfg(target_vendor = "apple")'.dependencies]
wgpu = { workspace = true, features = ["metal"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
getrandom = { workspace = true, features = ["wasm_js"] }
getrandom_02 = { workspace = true, features = ["js"] }
moirai-pal = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
ritk-core = { workspace = true, features = ["test-helpers"] }
# The DICOMDIR reader validates the full record tree, so tests build indices
# through the format crate rather than hand-rolling one.
ritk-io = { workspace = true, features = ["test-util"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true }

[lints]
workspace = true
