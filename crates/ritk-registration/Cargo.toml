[package]
name = "ritk-registration"
version = "0.54.0"
description = "Medical image registration algorithms for RITK"
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
repository.workspace = true
publish = true
edition = "2021"
license.workspace = true

[features]
default = ["direct-parzen", "serde"]
# Use direct sparse-loop histogram computation.
direct-parzen = []
serde = ["dep:serde"]

[dependencies]
ritk-core = { path = "../ritk-core", version = "0.10.0" }
ritk-image = { path = "../ritk-image", version = "0.4.0" }
ritk-wgpu-compat = { path = "../ritk-wgpu-compat", version = "0.2.0" }
ritk-spatial = { path = "../ritk-spatial", version = "0.2.0" }
ritk-statistics = { path = "../ritk-statistics", version = "0.4.0" }
ritk-interpolation = { path = "../ritk-interpolation", version = "0.5.0" }
ritk-transform = { path = "../ritk-transform", version = "0.2.0" }
ritk-filter = { path = "../ritk-filter", version = "0.3.0" }
ritk-segmentation = { path = "../ritk-segmentation", version = "0.3.0" }
ritk-model = { path = "../ritk-model", version = "0.2.0" }
ritk-tensor-ops = { path = "../ritk-tensor-ops", version = "0.2.0" }
ritk-parcellation = { path = "../ritk-parcellation", version = "0.1.0" }
bytemuck = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
leto = { workspace = true }
leto-ops = { workspace = true }
eunomia = { workspace = true }
moirai = { workspace = true }
coeus-core = { workspace = true }
coeus-tensor = { workspace = true }
coeus-ops = { workspace = true }
coeus-autograd = { workspace = true }
coeus-nn = { workspace = true }
coeus-optim = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
ritk-io = { path = "../ritk-io", version = "0.3.0" }
tracing-subscriber = { workspace = true }
walkdir = { workspace = true }
image = { workspace = true }
base64 = { workspace = true }
criterion = { workspace = true }
rand = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
ritk-image = { path = "../ritk-image", features = ["test-helpers"], version = "0.4.0" }


[[bench]]
name = "lddmm_smoothing"
harness = false

[[example]]
name = "dl_registration"
path = "examples/dl_registration.rs"

[lints]
workspace = true
