[package]
name = "ritk-filter"
version = "0.3.0"
description = "Medical image filtering algorithms for RITK"
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
repository.workspace = true
publish = true
edition = "2021"
license.workspace = true

[dependencies]
ritk-core = { path = "../ritk-core", version = "0.10.0" }
ritk-image = { path = "../ritk-image", features = ["test-helpers"], version = "0.4.0" }
ritk-wgpu-compat = { path = "../ritk-wgpu-compat", version = "0.2.0" }
ritk-morphology = { path = "../ritk-morphology", version = "0.2.0" }
ritk-annotation = { path = "../ritk-annotation", version = "0.2.0" }
ritk-tensor-ops = { path = "../ritk-tensor-ops", version = "0.2.0" }
ritk-statistics = { path = "../ritk-statistics", version = "0.4.0" }
ritk-spatial = { path = "../ritk-spatial", version = "0.2.0" }
ritk-interpolation = { path = "../ritk-interpolation", version = "0.5.0" }
ritk-transform = { path = "../ritk-transform", version = "0.2.0" }
anyhow = { workspace = true }
apollo-fft = { workspace = true }
eunomia = { workspace = true }
gaia = { workspace = true }
rand = { workspace = true }
moirai = { workspace = true }
serde = { workspace = true }
coeus-core = { workspace = true }
coeus-ops = { workspace = true }
coeus-tensor = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }
# Integration tests cannot see the crate's own `[dependencies]`; the allocation
# measurement needs the same parallel-collect entry point the kernels use in
# order to subtract the scheduler's allocations from the kernel's.
moirai = { workspace = true }

[[bench]]
name = "cpr_path"
harness = false

[[bench]]
name = "cpr_apply"
harness = false

[[bench]]
name = "bilateral"
harness = false

[[bench]]
name = "median"
harness = false

[[bench]]
name = "separable_box"
harness = false

[[bench]]
name = "euclidean_dt"
harness = false

[lints]
workspace = true
