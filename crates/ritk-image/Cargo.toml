[package]
name = "ritk-image"
version = "0.3.0"
description = "Native medical image storage and metadata for RITK"
authors.workspace = true
repository.workspace = true
publish = true
edition = "2021"
license.workspace = true

[dependencies]
ritk-spatial = { path = "../ritk-spatial", version = "0.2.0" }
ritk-wgpu-compat = { path = "../ritk-wgpu-compat", version = "0.2.0" }
anyhow = { workspace = true }
coeus-core = { workspace = true }
coeus-tensor = { workspace = true }
coeus-ops = { workspace = true }
coeus-autograd = { workspace = true }
coeus-nn = { workspace = true }
coeus-optim = { workspace = true }
rand = { workspace = true }

[features]
### Expose `test_support` helpers to downstream test crates.
## Add `ritk-image = { …, features = ["test-helpers"] }` to your `[dev-dependencies]`.
test-helpers = []

