[package]
name = "ritk-cli"
version = "0.1.0"
description = "Command-line medical image tools for RITK"
authors.workspace = true
repository.workspace = true
publish = false
edition = "2021"
license.workspace = true

[[bin]]
name = "ritk"
path = "src/main.rs"

[dependencies]
ritk-core = { path = "../ritk-core", version = "0.10.0" }
ritk-image = { path = "../ritk-image", version = "0.4.0" }
ritk-spatial = { path = "../ritk-spatial", version = "0.2.0" }
ritk-statistics = { path = "../ritk-statistics", version = "0.4.0" }
ritk-interpolation = { path = "../ritk-interpolation", version = "0.5.0" }
serde_json = { workspace = true }
ritk-transform = { path = "../ritk-transform", version = "0.2.0" }
ritk-filter = { path = "../ritk-filter", version = "0.3.0" }
ritk-segmentation = { path = "../ritk-segmentation", version = "0.3.0" }
ritk-io = { path = "../ritk-io", version = "0.3.0" }
ritk-registration = { path = "../ritk-registration", version = "0.54.0" }
ritk-diffusion = { path = "../ritk-diffusion", version = "0.1.0" }
ritk-diffusion-scheme = { path = "../ritk-diffusion-scheme", version = "0.2.0" }
ritk-tractography = { path = "../ritk-tractography", version = "0.1.0" }
ritk-connectome = { path = "../ritk-connectome", version = "0.1.0" }
ritk-parcellation = { path = "../ritk-parcellation", version = "0.1.0" }
ritk-tck = { path = "../ritk-tck", version = "0.1.0" }
ritk-trk = { path = "../ritk-trk", version = "0.1.0" }
ritk-trx = { path = "../ritk-trx", version = "0.1.0" }
gaia = { workspace = true }
ritk-snap = { path = "../ritk-snap", version = "0.1.0" }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
leto = { workspace = true }
coeus-core = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
ritk-nifti = { path = "../ritk-nifti", version = "0.2.0" }
ritk-tck = { path = "../ritk-tck", version = "0.1.0" }
gaia = { workspace = true }
leto = { workspace = true }
serde_json = { workspace = true }
