[package]
name = "ritk-python"
version = "0.13.0"
description = "Python extension bindings for RITK"
authors.workspace = true
repository.workspace = true
publish = false
edition.workspace = true
license.workspace = true

[lib]
name = "_ritk"
crate-type = ["cdylib", "rlib"]

[features]
default = ["abi3"]
abi3 = ["pyo3/abi3-py39"]
abi3t = ["pyo3/abi3t-py315"]

[dependencies]
pyo3 = { workspace = true }
numpy = { workspace = true }
coeus-core = { workspace = true }
coeus-tensor = { workspace = true }
ritk-core = { path = "../ritk-core", version = "0.12.0" }
ritk-image = { path = "../ritk-image", version = "0.6.0" }
ritk-spatial = { workspace = true }
ritk-statistics = { path = "../ritk-statistics", version = "0.7.0" }
ritk-diffusion = { path = "../ritk-diffusion", version = "0.1.0" }
ritk-diffusion-scheme = { workspace = true }
ritk-interpolation = { path = "../ritk-interpolation", version = "0.7.0" }
ritk-transform = { path = "../ritk-transform", version = "0.4.0" }
ritk-filter = { path = "../ritk-filter", version = "0.6.1" }
ritk-segmentation = { path = "../ritk-segmentation", version = "0.6.0" }
ritk-io = { path = "../ritk-io", version = "0.9.0" }
ritk-registration = { path = "../ritk-registration", version = "0.57.0" }
ritk-parcellation = { path = "../ritk-parcellation", version = "0.3.0" }
ritk-connectome = { path = "../ritk-connectome", version = "0.2.0" }
gaia = { workspace = true }
leto = { workspace = true }
anyhow = { workspace = true }

[lints]
workspace = true
