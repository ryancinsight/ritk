name: Deploy mdBook

on:
  push:
    branches: [main]
    paths:
      - "docs/book/**"
      - ".github/workflows/book-pages.yml"
  pull_request:
    paths:
      - "docs/book/**"
      - ".github/workflows/book-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  book:
    # Body owned once by Atlas (ADR 0035), pinned by SHA like any action. The
    # shared workflow keeps the pull-request build and skips deployment there,
    # so PRs still prove the book builds without publishing it.
    uses: ryancinsight/atlas/.github/workflows/book-pages.yml@9772542cc9dbd53123da0b369a75f34a180da867
    permissions:
      contents: read
      # The shared deploy job publishes to Pages over OIDC.
      pages: write
      id-token: write
    with:
      output-path: target/book/ritk
      # Preserve RITK's prior mdBook test gate and use the repository-pinned
      # toolchain for it. The shared workflow owns the test, build, and Pages
      # artifact steps.
      mdbook-test: true
      rust-toolchain: "1.97.0"
