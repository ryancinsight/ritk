name: Deploy mdBook

on:
  push:
    branches: [main]
    paths:
      - "docs/book/**"
      - ".github/workflows/book-pages.yml"
  pull_request:
    paths:
      - "docs/book/**"
      - ".github/workflows/book-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-pages-${{ github.ref }}
  # Deploys queue behind one another; a half-cancelled deploy is worse than a
  # superseded one, and a cancelled default-branch run leaves that merge undeployed.
  cancel-in-progress: false

jobs:
  book:
    # Body owned once by Atlas (ADR 0035), pinned by SHA like any action. The
    # shared workflow keeps the pull-request build and skips deployment there,
    # so PRs still prove the book builds without publishing it.
    uses: ryancinsight/atlas/.github/workflows/book-pages.yml@20c93980f7c98f2e23a89c4a0540f16c8f2d7239
    permissions:
      contents: read
      # The shared deploy job publishes to Pages over OIDC.
      pages: write
      id-token: write
    with:
      output-path: target/book/ritk
      mdbook-test: true
      rust-toolchain: "1.97.0"
      cargo-package: ritk-statistics
      cargo-crate: ritk_statistics
