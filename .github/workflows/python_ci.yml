# Python wheel build and smoke-test matrix.
#
# Invariants:
#   - maturin build must succeed on all target Python versions.
#   - Python API parity and smoke tests must pass against the installed wheel.
#   - No test is skipped or marked xfail without documented justification.
#
# Developer note:
#   - `crates/ritk-python/tests/python_api_drift_report.py` prints a human-readable
#     drift summary for Rust registrations, `.pyi` stubs, smoke-test required lists,
#     and the top-level `ritk` package contract.
#   - Use it locally when parity tests fail to identify missing, extra, or duplicate
#     exports before updating bindings, stubs, or smoke coverage.
#
# Trigger: push/PR to main or any sprint/* branch.

name: Python CI

on:
  push:
    branches:
      - main
      - "sprint/*"
    paths-ignore:
      - 'backlog.md'
      - 'checklist.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'docs/**'
      - '.github/agents/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'backlog.md'
      - 'checklist.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'docs/**'
      - '.github/agents/**'
  # The full Python-version x OS matrix runs here, never per pull request
  # (engineering_gates: workflow hygiene).
  schedule:
    - cron: '47 5 * * 1'
  workflow_dispatch:

concurrency:
  # Pull requests share one group per ref and cancel superseded runs; default-
  # branch runs get one group per commit, since GitHub supersedes a pending run
  # in a shared group whatever `cancel-in-progress` says.
  group: python-ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # A pull request pays one cell, and only when the binding's inputs changed;
  # the default branch pays one cell as its merge gate; schedule and dispatch
  # run the full matrix as the selection-drift backstop.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      python: ${{ steps.classify.outputs.python }}
      matrix: ${{ steps.classify.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Classify the pushed range
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          event="${{ github.event_name }}"
          python=true
          if [[ "$event" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            git fetch --no-tags --depth=1 origin "$base"
            changed="$(git diff --name-only "$base" HEAD)"
            if ! printf '%s\n' "$changed" | grep -qE '^(crates/ritk-python/|Cargo\.lock$|Cargo\.toml$|\.github/workflows/python_ci\.yml$)'; then
              python=false
            fi
          fi
          if [[ "$event" == "schedule" || "$event" == "workflow_dispatch" ]]; then
            matrix='{"python-version":["3.9","3.10","3.11","3.12"],"os":["ubuntu-latest","windows-latest","macos-latest"],"include":[{"os":"ubuntu-latest","python-version":"3.13"}]}'
          else
            matrix='{"python-version":["3.12"],"os":["ubuntu-latest"]}'
          fi
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-and-smoke-test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.python == 'true'
    # Windows is the binding matrix path at about 15 minutes; retain one full
    # observed runtime for dependency and runner variance.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ritk
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: ritk
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: "ritk -> target"
          key: python-${{ matrix.python-version }}-abi3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Add MSYS2 ucrt64 to PATH (Windows — clang-cl C++ runtime DLLs)
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'C:/msys64/ucrt64/bin' >> $GITHUB_PATH

      - name: Install Python test tooling
        shell: bash
        run: |
          python -m pip install -r crates/ritk-python/requirements-test.txt
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            python -m pip install 'maturin[patchelf]'
          else
            python -m pip install maturin
          fi

      - name: Build ritk wheel
        run: >-
          maturin build
          --release
          --manifest-path crates/ritk-python/Cargo.toml
          --out dist

      - name: Install built ritk wheel
        shell: bash
        run: |
          python -m pip uninstall -y ritk || true
          python -m pip install --force-reinstall --no-deps --no-index --find-links dist ritk

      - name: Run Python parity and smoke tests
        run: >-
          pytest
          crates/ritk-python/tests/test_diffusion.py
          crates/ritk-python/tests/test_python_api_parity.py
          crates/ritk-python/tests/test_segmentation_bindings.py
          crates/ritk-python/tests/test_statistics_bindings.py
          crates/ritk-python/tests/test_smoke.py
          crates/ritk-python/tests/test_simpleitk_parity.py
          crates/ritk-python/tests/test_vtk_parity.py
          crates/ritk-python/tests/test_ct_mri_registration_parity.py
          -v
          --tb=short

      - name: Run Python API drift report (always -- diagnostic context)
        # Diagnostic-only: prints a human-readable drift summary for Rust
        # registrations, .pyi stubs, smoke-test required lists, and the
        # top-level ritk package contract.  Exits 1 on detected drift, so
        # continue-on-error is set; the parity test step above is the
        # authoritative CI gate.
        if: always()
        shell: bash
        continue-on-error: true
        run: python crates/ritk-python/tests/python_api_drift_report.py

      - name: Install cargo-nextest
        uses: taiki-e/install-action@f47c9687269207d6b374de4134cb8b1fa5b49649 # cargo-nextest

      - name: Run Rust unit tests
        run: cargo nextest run -p ritk-python --lib
        timeout-minutes: 10

  free-threaded-contract:
    name: CPython 3.15t free-threaded contract
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.python == 'true'
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ritk
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: ritk
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: Set up free-threaded Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.15"
          allow-prereleases: true
          freethreaded: true

      - name: Install binding test tooling
        run: |
          python -m pip install -r crates/ritk-python/requirements-free-threaded.txt
          python -m pip install 'maturin>=1.9.4,<2.0'

      - name: Build abi3t wheel
        run: >-
          maturin build --release --locked --no-default-features --features abi3t
          --manifest-path crates/ritk-python/Cargo.toml --out dist

      - name: Install abi3t wheel
        run: python -m pip install --force-reinstall --no-deps --no-index --find-links dist ritk

      - name: Assert free-threaded interpreter
        run: python -c "import sys; assert not sys._is_gil_enabled()"

      - name: Run free-threaded binding contract
        run: pytest crates/ritk-python/tests/test_free_threaded.py -v --tb=short
