name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'backlog.md'
      - 'checklist.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'docs/**'
      - '.github/agents/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'backlog.md'
      - 'checklist.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'docs/**'
      - '.github/agents/**'

concurrency:
  # Pull requests share one group per ref and cancel superseded runs; default-
  # branch runs get one group per commit, since GitHub supersedes a pending run
  # in a shared group whatever `cancel-in-progress` says.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  adr-index:
    name: ADR index is current
    # atlas owns the one generator (ATLAS-ADR-FORM-NORMALIZATION-2026-09-02); strict: the ADRs carry the canonical heading form and numbering.
    uses: ryancinsight/atlas/.github/workflows/adr-index-guard.yml@378081ec6cb04da4009253ecfb25e8b6966aa4e2
    permissions:
      contents: read
    with:
      strict: true

  # Guards the one artifact whose correctness cannot be checked from inside the
  # overlay environment that produces it. Calls the shared Atlas workflow.
  lockfile:
    name: Lockfile integrity
    uses: ryancinsight/atlas/.github/workflows/lockfile-guard.yml@886d85b0e4bea20c8e5ec4b4239e6ba9cdbcf74d
    permissions:
      contents: read

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ritk
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: ritk
          persist-credentials: false

      - name: Install stable toolchain with rustfmt
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.0
          components: rustfmt

      - name: Check formatting
        shell: bash
        run: |
          cargo metadata --no-deps --format-version 1 \
            | jq -r '.workspace_members[] as $id | .packages[] | select(.id == $id) | "-p", .name' \
            | xargs sh -c 'cargo fmt "$@" -- --check' _

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ritk
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: ritk
          persist-credentials: false

      - name: Install stable toolchain with clippy
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.0
          components: clippy

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        timeout-minutes: 10

  rustdoc:
    name: Rustdoc
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ritk
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: ritk
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.0

      - name: Document workspace
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps
        timeout-minutes: 10

  dependency-alignment:
    name: Workspace Dependency Alignment
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ritk
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: ritk
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: Enforce workspace dependency inheritance
        run: cargo run -p xtask -- dependency-alignment

  test:
    name: Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ritk
    timeout-minutes: ${{ matrix.timeout_minutes }}
    needs: dependency-alignment
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            timeout_minutes: 30
          - os: macos-latest
            timeout_minutes: 30
          - os: windows-latest
            # The full suite completes in about 25 minutes including setup;
            # retain ten minutes for the slower Windows cache cleanup.
            timeout_minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: ritk
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: Install LLVM and Clang (Linux)
        if: runner.os == 'Linux'
        run: |
          # GitHub-hosted ubuntu-latest runners pre-install clang; skip the
          # apt-get update (the main time-consumer) when it is already present.
          if ! command -v clang > /dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends clang lld
          fi

      - name: Install LLVM and Clang (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm && echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Install LLVM and Clang (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm --no-progress -y
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install cargo-nextest
        uses: taiki-e/install-action@f47c9687269207d6b374de4134cb8b1fa5b49649 # cargo-nextest

      # Shared-key rust-cache instead of a lockfile-hash actions/cache: the
      # hash key wipes the whole target/ directory whenever Cargo.lock moves
      # (e.g. a first-party dependency repin), forcing a full workspace
      # rebuild on exactly the routine dependency-bump PRs. rust-cache
      # invalidates incrementally and shares one entry across jobs, written
      # from main only so concurrent branches cannot evict each other.
      # Mirrors the CFDrs #375 lever under ATLAS-CI-RUNNER-SATURATION.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: ritk
          shared-key: ritk
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run tests with nextest
        run: cargo nextest run --workspace --lib --tests

  python-wheel:
    name: Python Wheel (smoke test)
    runs-on: ubuntu-latest
    # The full installed-wheel suite is a performance gate, not a long-running
    # validation lane; setup and tests must complete within the native CI bound.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ritk
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: ritk
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Install maturin
        run: pip install maturin

      - name: Build wheel
        run: >-
          maturin build
          --release
          --manifest-path crates/ritk-python/Cargo.toml
          --out /tmp/ritk-wheel

      - name: Smoke test wheel
        run: |
          pip install -r crates/ritk-python/requirements-test.txt
          pip install --find-links /tmp/ritk-wheel ritk
          python -c "import importlib.metadata; import ritk; assert ritk.__version__ == importlib.metadata.version('ritk')"
          python -c "import numpy as np; import ritk; img = ritk.Image(np.zeros((5, 5, 5), dtype=np.float32)); phi = ritk.Image(np.ones((5, 5, 5), dtype=np.float32)); opts = ritk.segmentation.ShapeDetectionOptions(max_iterations=1); out = ritk.segmentation.shape_detection_segment(img, phi, opts); arr = out.to_numpy(); assert arr.shape == (5, 5, 5); assert np.isfinite(arr).all()"
          denoising_test="crates/ritk-python/tests/test_simpleitk_cmake_data.py::test_cmake_patch_based_denoising_structural"
          python -m pytest "$denoising_test" -vv --durations=1
          python -m pytest crates/ritk-python/tests \
            --deselect "tests/test_simpleitk_cmake_data.py::test_cmake_patch_based_denoising_structural" \
            -n 2 --dist loadscope -vv --durations=25
