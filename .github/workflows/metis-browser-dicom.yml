name: Native Safari workstation diagnostics
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact browser qualification commit
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.candidate }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          run-id: 45103975453
          github-token: ${{ github.token }}
          name: asterslice-web
          path: workstation
      - name: Verify native workstation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/safari-study/prepare.py workstation /Users/Shared/RITKPublicStudy
          export RITK_HTTP_RUNTIME="$RUNNER_TEMP" RITK_WEB_BUNDLE="$PWD/workstation"
          /usr/sbin/httpd -X -f "$PWD/scripts/safari-study/httpd.conf" &
          cd scripts/safari-study
          command -v xcodegen || brew install xcodegen
          xcodegen generate
          xcodebuild test -project SafariStudy.xcodeproj -scheme SafariStudy -destination "platform=macOS,arch=$(uname -m)" -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/Safari.xcresult"
      - name: Record WebKit rendering diagnostics
        if: failure()
        shell: bash
        run: |
          /usr/bin/log show --last 4m --style compact --predicate '(process CONTAINS "WebKit" OR process == "Safari") AND (eventMessage CONTAINS[c] "canvas" OR eventMessage CONTAINS[c] "graphics" OR eventMessage CONTAINS[c] "metal" OR eventMessage CONTAINS[c] "surface")' | tail -100
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: safari-report-${{ matrix.runner }}
          path: ${{ runner.temp }}/Safari.xcresult
          retention-days: 2
  firefox:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.candidate }}
          path: ritk
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ryancinsight/metis
          ref: 94b698dcdb49fde0c2dbf7ec855183ffa300a3c9
          path: metis
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          run-id: 45100016465
          github-token: ${{ github.token }}
          name: asterslice-web
          path: metis/output/browser
      - working-directory: ritk
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x800x24 -nolisten tcp >/dev/null 2>&1 &
          export DISPLAY=:99
          "$GECKOWEBDRIVER/geckodriver" --port 4444 &
          for i in {1..40}; do if curl -sf 127.0.0.1:4444/status >/dev/null; then break; fi; sleep 0.25; done
          PYTHONPATH="$GITHUB_WORKSPACE/metis/scripts" python3 scripts/browser_workspace.py ../metis/output/browser test_data/2_head_mri_t2/DICOM --comparison test_data/3_head_ct_mridir/DICOM --driver-url http://127.0.0.1:4444 --engine firefox --scale 2 --cycles 4 --output "$RUNNER_TEMP/evidence"
