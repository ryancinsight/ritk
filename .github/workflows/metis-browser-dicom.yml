name: Native Safari workstation diagnostics
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact browser qualification commit
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.candidate }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          run-id: 45097686376
          github-token: ${{ github.token }}
          name: asterslice-web
          path: workstation
      - name: Verify native workstation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/safari-study/prepare.py workstation /Users/Shared/RITKPublicStudy
          python3 -m http.server 17823 --bind 127.0.0.1 --directory workstation &
          cd scripts/safari-study
          command -v xcodegen || brew install xcodegen
          xcodegen generate
          xcodebuild test -project SafariStudy.xcodeproj -scheme SafariStudy -destination 'platform=macOS,arch=arm64' -parallel-testing-enabled NO
