name: Native Safari workstation diagnostics
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact browser qualification commit
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          run-id: 45103975453
          github-token: ${{ github.token }}
          name: asterslice-web
          path: workstation
      - name: Verify native workstation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/safari-study/prepare.py workstation /Users/Shared/RITKPublicStudy
          export RITK_HTTP_RUNTIME="$RUNNER_TEMP" RITK_WEB_BUNDLE="$PWD/workstation"
          /usr/sbin/httpd -X -f "$PWD/scripts/safari-study/httpd.conf" &
          cd scripts/safari-study
          command -v xcodegen || brew install xcodegen
          xcodegen generate
          xcodebuild test -project SafariStudy.xcodeproj -scheme SafariStudy -destination "platform=macOS,arch=$(uname -m)" -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/Safari.xcresult"
      - name: Record WebKit rendering diagnostics
        if: failure()
        shell: bash
        run: |
          /usr/bin/log show --last 4m --style compact --predicate '(process CONTAINS "WebKit" OR process == "Safari") AND (eventMessage CONTAINS[c] "canvas" OR eventMessage CONTAINS[c] "graphics" OR eventMessage CONTAINS[c] "metal" OR eventMessage CONTAINS[c] "surface")' | tail -100
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: safari-report-${{ matrix.runner }}
          path: ${{ runner.temp }}/Safari.xcresult
          retention-days: 2
