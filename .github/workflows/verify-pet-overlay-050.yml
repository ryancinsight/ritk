name: Enhanced PET Aequitas 0.5.0 Windows verification

on:
  push:
    branches: [codex/verify-pet-overlay-050]

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUST_BACKTRACE: '1'

jobs:
  enhanced-pet:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Load the two unpublished locked source revisions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-Git {
            & git @args
            if ($LASTEXITCODE -ne 0) { throw "git $args failed" }
          }
          $sources = @{
            gaia = @('0f520de6e2fdef7a027bf8cbf13eb40b06656337', 'f2c472b68df856f6598dc553ff13474a050150f3')
            leto = @('6483eac33b627f43ecf0e46e3cc300ca99b78a20', '05bd010596c7918437e95be5788e56b530491ea5')
          }
          foreach ($name in $sources.Keys) {
            $upstream = "https://github.com/ryancinsight/$name"
            if ($name -eq 'leto') { $upstream += '.git' }
            $provider = Join-Path $env:RUNNER_TEMP "$name.git"
            $bundle = Join-Path $PWD ".github/verification/$name.bundle"
            $base, $locked = $sources[$name]
            Invoke-Git init --bare $provider
            Invoke-Git -C $provider fetch --no-tags $upstream $base
            Invoke-Git -C $provider bundle verify $bundle
            Invoke-Git -C $provider bundle unbundle $bundle
            Invoke-Git -C $provider update-ref refs/heads/locked-candidate $locked
            $sourceUri = ([Uri]::new((Resolve-Path $provider).Path)).AbsoluteUri
            Invoke-Git config --global "url.$sourceUri.insteadOf" $upstream
          }
      - name: Check out the exact candidate and locate the Windows SDK
        shell: pwsh
        run: |
          git switch --detach HEAD^
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $candidate = git rev-parse HEAD
          if ($candidate -ne '945274e0c2b190f1cdcbad0c325ff20f0985f4e2') { throw "Unexpected candidate $candidate" }
          Write-Output $candidate
          $graph = cargo metadata --locked --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in @('aequitas','eunomia','eunomia-derive')) {
            $version = if ($name -eq 'aequitas') { '0.5.0' } else { '0.12.1' }
            $pkg = @($graph.packages | Where-Object { $_.name -eq $name })
            if ($pkg.Count -ne 1 -or $pkg[0].version -ne $version -or $pkg[0].source -notlike 'registry+*') {
              throw "Unexpected source or version for $name"
            }
          }
          $sdk = Join-Path ${Env:ProgramFiles(x86)} 'Windows Kits\10\Include'
          $headers = Get-ChildItem $sdk -Filter assert.h -Recurse
          if (!$headers) { throw 'Windows SDK CRT assert.h is absent' }
          $headers.FullName
          rustup show active-toolchain
      - name: Build the default Windows viewer and prepare runtime tests
        shell: pwsh
        run: |
          cargo build --locked -p ritk-snap --bin ritk-snap
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p ritk-io -p ritk-snap --lib --no-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute Enhanced PET reader and Windows viewer tests
        timeout-minutes: 1
        shell: pwsh
        run: |
          cargo test --locked -p ritk-io -p ritk-snap --lib enhanced_pet -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p ritk-snap --lib presentation::native_session::tests::display::native_overlay_displays_the_pet_slice_provenance -- --exact --test-threads=1 |
            Tee-Object -Variable overlay
          if ($LASTEXITCODE -ne 0 -or !($overlay -match 'test result: ok\. 1 passed')) {
            throw 'The native overlay assertion did not pass'
          }
          & target\debug\ritk-snap.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
