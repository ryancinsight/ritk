name: Enhanced PET Aequitas 0.5.0 Windows verification

on:
  push:
    branches: [codex/verify-native-dicom-pet-050-release-final]

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUST_BACKTRACE: '1'

jobs:
  enhanced-pet:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check out the exact candidate and locate the Windows SDK
        shell: pwsh
        run: |
          git switch --detach HEAD^
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $candidate = git rev-parse HEAD
          if ($candidate -ne '61ec4919eb923ffbe42509a9c6f5353d34f974f4') { throw "Unexpected candidate $candidate" }
          Write-Output $candidate
          $graph = cargo metadata --locked --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in @('aequitas','eunomia','eunomia-derive')) {
            $version = if ($name -eq 'aequitas') { '0.5.0' } else { '0.12.1' }
            $pkg = @($graph.packages | Where-Object { $_.name -eq $name })
            if ($pkg.Count -ne 1 -or $pkg[0].version -ne $version -or $pkg[0].source -notlike 'registry+*') {
              throw "Unexpected source or version for $name"
            }
          }
          $sdk = Join-Path ${Env:ProgramFiles(x86)} 'Windows Kits\10\Include'
          $headers = Get-ChildItem $sdk -Filter assert.h -Recurse
          if (!$headers) { throw 'Windows SDK CRT assert.h is absent' }
          $headers.FullName
          rustup show active-toolchain
      - name: Build the default Windows viewer and prepare runtime tests
        shell: pwsh
        run: |
          cargo build --locked -p ritk-snap --bin asterslice
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p ritk-io -p ritk-snap --lib --no-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute Enhanced PET reader and Windows viewer tests
        timeout-minutes: 1
        shell: pwsh
        run: |
          cargo test --locked -p ritk-io -p ritk-snap --lib enhanced_pet -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p ritk-io -p ritk-snap --lib presentation::native_session::tests::display::native_overlay_displays_the_pet_slice_provenance -- --exact --test-threads=1 |
            Tee-Object -Variable overlay
          if ($LASTEXITCODE -ne 0 -or !($overlay -match 'test result: ok\. 1 passed')) {
            throw 'The native overlay assertion did not pass'
          }
          & target\debug\asterslice.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  package-cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.0
      - name: Build the normalized RITK archives against crates.io
        shell: bash
        run: |
          set -euo pipefail
          git switch --detach HEAD^
          test "$(git rev-parse HEAD)" = 61ec4919eb923ffbe42509a9c6f5353d34f974f4
          cargo publish --locked --dry-run \
            -p ritk-analyze \
            -p ritk-annotation \
            -p ritk-block-matching \
            -p ritk-core \
            -p ritk-dicom \
            -p ritk-diffusion-scheme \
            -p ritk-filter \
            -p ritk-image \
            -p ritk-image-io \
            -p ritk-interpolation \
            -p ritk-io \
            -p ritk-jpeg \
            -p ritk-metaimage \
            -p ritk-mgh \
            -p ritk-mif \
            -p ritk-minc \
            -p ritk-model \
            -p ritk-nifti \
            -p ritk-nrrd \
            -p ritk-parcellation \
            -p ritk-png \
            -p ritk-registration \
            -p ritk-segmentation \
            -p ritk-spatial \
            -p ritk-statistics \
            -p ritk-tensor-ops \
            -p ritk-tiff \
            -p ritk-transform \
            -p ritk-vtk
