name: DICOM frame units and PET Windows verification

on:
  push:
    branches: [codex/verify-frame-units-windows-head]

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUST_BACKTRACE: '1'

jobs:
  enhanced-pet:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check out the exact candidate and locate the Windows SDK
        shell: pwsh
        run: |
          git switch --detach '4998ec0d24c1f8e2f878b0189492d0950586bd46'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $candidate = git rev-parse HEAD
          if ($candidate -ne '4998ec0d24c1f8e2f878b0189492d0950586bd46') { throw "Unexpected candidate $candidate" }
          Write-Output $candidate
          $graph = cargo metadata --locked --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in @('aequitas','eunomia','eunomia-derive')) {
            $version = if ($name -eq 'aequitas') { '0.5.0' } else { '0.12.1' }
            $pkg = @($graph.packages | Where-Object { $_.name -eq $name })
            if ($pkg.Count -ne 1 -or $pkg[0].version -ne $version -or $pkg[0].source -notlike 'registry+*') {
              throw "Unexpected source or version for $name"
            }
          }
          $sdk = Join-Path ${Env:ProgramFiles(x86)} 'Windows Kits\10\Include'
          $headers = Get-ChildItem $sdk -Filter assert.h -Recurse
          if (!$headers) { throw 'Windows SDK CRT assert.h is absent' }
          $headers.FullName
          rustup show active-toolchain
      - name: Build the default Windows viewer and prepare runtime tests
        shell: pwsh
        run: |
          cargo build --locked -p ritk-snap --bin asterslice
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p ritk-io -p ritk-snap --lib --no-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute Enhanced PET reader and Windows viewer tests
        timeout-minutes: 1
        shell: pwsh
        run: |
          cargo test --locked -p ritk-io -p ritk-snap --lib enhanced_pet -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p ritk-io -p ritk-snap --lib presentation::native_session::tests::display::native_overlay_displays_the_pet_slice_provenance -- --exact --test-threads=1 |
            Tee-Object -Variable overlay
          if ($LASTEXITCODE -ne 0 -or !($overlay -match 'test result: ok\. 1 passed')) {
            throw 'The native overlay assertion did not pass'
          }
          cargo test --locked -p ritk-io -p ritk-snap --lib part10_oblique_series_preserves_axis_order_and_patient_origin -- --test-threads=1 |
            Tee-Object -Variable series
          if ($LASTEXITCODE -ne 0 -or !($series -match 'test result: ok\. 1 passed')) {
            throw 'The oblique series geometry assertion did not pass'
          }
          foreach ($check in @(
            'oblique_native_series_writes_patient_positions_in_millimetres',
            'series_writer_rejects_spacing_that_underflows_in_metres',
            'oblique_multiframe_preserves_patient_origin_and_interpolated_plane',
            'dicom_voi_and_rescale_values_keep_declared_modality_units',
            'oblique_multiframe_requires_compatible_calibrated_units_for_interpolation',
            'classic_dicom_requires_compatible_calibrated_units_for_interpolation'
          )) {
            cargo test --locked -p ritk-io -p ritk-snap --lib $check -- --test-threads=1 |
              Tee-Object -Variable writer
            if ($LASTEXITCODE -ne 0 -or !($writer -match 'test result: ok\. 1 passed')) {
              throw "The writer test $check did not pass"
            }
          }
          & target\debug\asterslice.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
