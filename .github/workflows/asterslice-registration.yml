name: AsterSlice Windows registration
on:
  pull_request:
    paths:
      - 'crates/ritk-codecs/src/jpeg/**'
      - 'crates/ritk-dicom/src/**'
      - 'crates/ritk-io/src/format/dicom/**'
      - 'crates/ritk-snap/src/dicom/**'
      - 'crates/ritk-snap/src/render/slice_render.rs'
      - 'crates/ritk-snap/src/loaded_volume.rs'
      - 'crates/ritk-snap/src/registration/**'
      - 'crates/ritk-snap/src/presentation/native_session/registration.rs'
      - 'crates/ritk-snap/src/presentation/native_session/tests/registration.rs'
      - '.github/workflows/asterslice-registration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: asterslice-windows-registration
      - name: Test DICOM JPEG import
        run: cargo test --locked --release -p ritk-codecs --lib jpeg::tests_decode
      - name: Test scalar pixel import and windowing
        run: cargo test --locked --release -p ritk-snap --lib scalar_precision
      - name: Test the Tools menu and CT/MR registration
        run: cargo test --locked --release -p ritk-snap --lib registration
      - name: Build AsterSlice
        run: cargo build --locked --release -p ritk-snap --bin asterslice
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AsterSlice-Windows-x64
          path: target/release/asterslice.exe
          if-no-files-found: error
          retention-days: 14
