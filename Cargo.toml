[workspace]
members = [
  "crates/ritk-filter",
  "crates/ritk-segmentation",
  "crates/ritk-vtk",
  "crates/ritk-core",
  "crates/ritk-dicom",
  "crates/ritk-codecs",
  "crates/ritk-nifti",
  "crates/ritk-nrrd",
  "crates/ritk-metaimage",
  "crates/ritk-mgh",
  "crates/ritk-analyze",
  "crates/ritk-png",
  "crates/ritk-jpeg",
  "crates/ritk-tiff",
  "crates/ritk-minc",
  "crates/ritk-io",
  "crates/ritk-model",
  "crates/ritk-registration",
  "crates/ritk-python",
  "crates/ritk-cli",
  "crates/ritk-snap",
  "crates/ritk-transform",
  "crates/ritk-interpolation",
  "crates/ritk-spatial",
  "crates/ritk-image",
  "crates/ritk-wgpu-compat",
  "crates/ritk-morphology",
  "crates/ritk-annotation",
  "crates/ritk-tensor-ops",
  "crates/ritk-statistics",
  "crates/ritk-diffusion-scheme",
  "crates/ritk-diffusion",
  "crates/ritk-tractography",
  "crates/ritk-connectome",
  "crates/ritk-trk",
  "crates/ritk-mif",
  "crates/ritk-tck",
  "crates/ritk-trx",
  "xtask",
]
resolver = "2"

[workspace.package]
license = "MIT OR Apache-2.0"
authors = ["Ryan Clanton <ryanclanton@outlook.com>"]
repository = "https://github.com/ryancinsight/ritk"

[workspace.dependencies]
iris = { version = "0.1.0", git = "https://github.com/ryancinsight/iris" }
ritk-filter = { path = "crates/ritk-filter", version = "0.2.60" }
ritk-segmentation = { path = "crates/ritk-segmentation", version = "0.2.0" }
ritk-core = { path = "crates/ritk-core", version = "0.9.0" }
ritk-dicom = { path = "crates/ritk-dicom", version = "0.1.0" }
ritk-codecs = { path = "crates/ritk-codecs", version = "0.5.3" }
ritk-nifti = { path = "crates/ritk-nifti", version = "0.1.0" }
ritk-nrrd = { path = "crates/ritk-nrrd", version = "0.1.1" }
ritk-metaimage = { path = "crates/ritk-metaimage", version = "0.1.1" }
ritk-mgh = { path = "crates/ritk-mgh", version = "0.2.0" }
ritk-analyze = { path = "crates/ritk-analyze", version = "0.1.0" }
ritk-png = { path = "crates/ritk-png", version = "0.1.0" }
ritk-jpeg = { path = "crates/ritk-jpeg", version = "0.1.0" }
ritk-tiff = { path = "crates/ritk-tiff", version = "0.1.0" }
ritk-minc = { path = "crates/ritk-minc", version = "0.1.0" }
ritk-vtk = { path = "crates/ritk-vtk", version = "0.1.0" }
ritk-io = { path = "crates/ritk-io", version = "0.2.0" }
ritk-model = { path = "crates/ritk-model", version = "0.1.0" }
ritk-registration = { path = "crates/ritk-registration", version = "0.53.0" }
ritk-transform = { path = "crates/ritk-transform", version = "0.1.0" }
ritk-interpolation = { path = "crates/ritk-interpolation", version = "0.4.0" }
ritk-spatial = { path = "crates/ritk-spatial", version = "0.1.0" }
ritk-image = { path = "crates/ritk-image", version = "0.2.0" }
ritk-wgpu-compat = { path = "crates/ritk-wgpu-compat", version = "0.1.0" }
ritk-morphology = { path = "crates/ritk-morphology", version = "0.1.0" }
ritk-annotation = { path = "crates/ritk-annotation", version = "0.1.0" }
ritk-tensor-ops = { path = "crates/ritk-tensor-ops", version = "0.1.0" }
ritk-statistics = { path = "crates/ritk-statistics", version = "0.3.0" }
ritk-diffusion = { path = "crates/ritk-diffusion", version = "0.1.0" }
ritk-diffusion-scheme = { path = "crates/ritk-diffusion-scheme", version = "0.1.0" }
ritk-tractography = { path = "crates/ritk-tractography", version = "0.1.0" }
ritk-connectome = { path = "crates/ritk-connectome", version = "0.1.0" }
ritk-trk = { path = "crates/ritk-trk", version = "0.1.0" }
ritk-mif = { path = "crates/ritk-mif", version = "0.1.0" }
ritk-tck = { path = "crates/ritk-tck", version = "0.1.0" }
ritk-trx = { path = "crates/ritk-trx", version = "0.1.0" }
gaia = { version = "0.3.0", git = "https://github.com/ryancinsight/gaia", default-features = false }
criterion = { version = "0.5", features = ["html_reports"] }
coeus-nn = { version = "0.9.0", git = "https://github.com/ryancinsight/Coeus.git" }
coeus-optim = { version = "0.9.0", git = "https://github.com/ryancinsight/Coeus.git" }
onnx-ir = "0.20.1"
pyo3 = { version = "0.22", features = ["abi3-py39"] }
numpy = "0.22"
dicom = { version = "0.10.0", default-features = false }
moirai = { package = "moirai-runtime", version = "0.4.0", git = "https://github.com/ryancinsight/Moirai.git", features = ["melinoe"] }
# Apollo FFT scratch caches use Eunomia complex values through Mnemosyne.
mnemosyne = { package = "mnemosyne-memory", version = "0.6.0", git = "https://github.com/ryancinsight/Mnemosyne.git", default-features = false, features = ["std_tls", "eunomia"] }
eunomia = { version = "0.7.0", git = "https://github.com/ryancinsight/eunomia", default-features = false }
coeus-core = { version = "0.9.0", git = "https://github.com/ryancinsight/Coeus.git" }
coeus-tensor = { version = "0.9.0", git = "https://github.com/ryancinsight/Coeus.git" }
coeus-ops = { version = "0.9.0", git = "https://github.com/ryancinsight/Coeus.git" }
coeus-leto = { version = "0.9.0", git = "https://github.com/ryancinsight/Coeus.git" }
coeus-autograd = { version = "0.9.0", git = "https://github.com/ryancinsight/Coeus.git" }
leto = { version = "0.40.0", git = "https://github.com/ryancinsight/leto.git" }
leto-ops = { version = "0.40.0", git = "https://github.com/ryancinsight/leto.git" }
apollo-fft = { version = "0.25.0", git = "https://github.com/ryancinsight/apollo" }
apollo-sht = { version = "0.7.0", git = "https://github.com/ryancinsight/apollo" }
aequitas = { version = "0.1.0", git = "https://github.com/ryancinsight/aequitas" }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytemuck = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.2"
tempfile = "3.10" # For testing
proptest = "1.0"
walkdir = "2.4"
rand = "0.9"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "stream", "json", "rustls"] }
wgpu = { version = "0.20", default-features = false, features = ["wgsl"] }
pollster = "0.3"
flate2 = "1.0"
tar = "0.4"
zip = { version = "0.6", default-features = false }
indicatif = "0.17"
dirs = "5.0"
sha2 = "0.10"
hex = "0.4"
zune-core = { version = "0.4", default-features = false }
zune-jpegxl = { version = "0.4", default-features = false }
mockito = "1"
eframe = "0.28"
egui = "0.28"
rfd = "0.14"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
getrandom = "0.3"
getrandom_02 = { package = "getrandom", version = "0.2" }
image = "0.24"
base64 = "0.22"
tiff = "0.9"

dicom-core = "0.10"
dicom-ul = "0.10"
dicom-pixeldata = { version = "0.10", default-features = false }
dicom-transfer-syntax-registry = { version = "0.10", default-features = false }
consus-hdf5 = { version = "0.1.0", git = "https://github.com/ryancinsight/consus.git", features = ["std"] }
consus-core = { version = "0.1.0", git = "https://github.com/ryancinsight/consus.git", features = ["std"] }
consus-compression = { version = "0.1.0", git = "https://github.com/ryancinsight/consus.git", features = ["std", "deflate"] }
consus-io = { version = "0.1.0", git = "https://github.com/ryancinsight/consus.git", features = ["std", "alloc"] }
consus-onnx = { version = "0.1.0", git = "https://github.com/ryancinsight/consus.git", features = ["std", "alloc"] }
jpeg-decoder = "0.3"

arrayvec = "0.7"

# ── Profile overrides ────────────────────────────────────────────────────────
# Test builds keep `opt-level = 0` and emit line tables so that
# `STATUS_STACK_BUFFER_OVERRUN` / `STATUS_ACCESS_VIOLATION` crashes (and any
# other panics) produce source-located backtraces without duplicating full
# variable and type debug records across the generic-heavy workspace.
[profile.test]
opt-level = 0
debug = "line-tables-only"
