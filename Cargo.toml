[workspace]
members = [
  "crates/ritk-filter",
  "crates/ritk-segmentation",
  "crates/ritk-vtk",
  "crates/ritk-core",
  "crates/ritk-dicom",
  "crates/ritk-codecs",
  "crates/ritk-nifti",
  "crates/ritk-nrrd",
  "crates/ritk-metaimage",
  "crates/ritk-mgh",
  "crates/ritk-analyze",
  "crates/ritk-png",
  "crates/ritk-jpeg",
  "crates/ritk-tiff",
  "crates/ritk-minc",
  "crates/ritk-io",
  "crates/ritk-model",
  "crates/ritk-registration",
  "crates/ritk-python",
  "crates/ritk-cli",
  "crates/ritk-snap",
  "crates/ritk-transform",
  "crates/ritk-interpolation",
  "crates/ritk-spatial",
  "crates/ritk-image",
  "crates/ritk-wgpu-compat",
  "crates/ritk-morphology",
  "crates/ritk-annotation",
  "crates/ritk-tensor-ops",
  "crates/ritk-statistics",
  "xtask",
]
resolver = "2"

[workspace.package]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
iris = { path = "../iris", version = "0.1.0" }
ritk-filter = { path = "crates/ritk-filter" }
ritk-segmentation = { path = "crates/ritk-segmentation" }
ritk-core = { path = "crates/ritk-core" }
ritk-dicom = { path = "crates/ritk-dicom" }
ritk-codecs = { path = "crates/ritk-codecs" }
ritk-nifti = { path = "crates/ritk-nifti" }
ritk-nrrd = { path = "crates/ritk-nrrd" }
ritk-metaimage = { path = "crates/ritk-metaimage" }
ritk-mgh = { path = "crates/ritk-mgh" }
ritk-analyze = { path = "crates/ritk-analyze" }
ritk-png = { path = "crates/ritk-png" }
ritk-jpeg = { path = "crates/ritk-jpeg" }
ritk-tiff = { path = "crates/ritk-tiff" }
ritk-minc = { path = "crates/ritk-minc" }
ritk-vtk = { path = "crates/ritk-vtk" }
ritk-io = { path = "crates/ritk-io" }
ritk-model = { path = "crates/ritk-model" }
ritk-registration = { path = "crates/ritk-registration" }
ritk-transform = { path = "crates/ritk-transform" }
ritk-interpolation = { path = "crates/ritk-interpolation" }
ritk-spatial = { path = "crates/ritk-spatial" }
ritk-image = { path = "crates/ritk-image" }
ritk-wgpu-compat = { path = "crates/ritk-wgpu-compat" }
ritk-morphology = { path = "crates/ritk-morphology" }
ritk-annotation = { path = "crates/ritk-annotation" }
ritk-tensor-ops = { path = "crates/ritk-tensor-ops" }
ritk-statistics = { path = "crates/ritk-statistics" }
gaia = { path = "../gaia", default-features = false }
criterion = { version = "0.5", features = ["html_reports"] }
coeus-nn = { path = "../coeus/crates/coeus-nn" }
coeus-optim = { path = "../coeus/crates/coeus-optim" }
onnx-ir = "0.20.1"
pyo3 = { version = "0.22", features = ["abi3-py39"] }
numpy = "0.22"
dicom = { version = "0.10.0", default-features = false }
moirai = { path = "../moirai/moirai", features = ["melinoe"] }
# Apollo FFT scratch caches use Eunomia complex values through Mnemosyne.
mnemosyne = { path = "../mnemosyne/crates/mnemosyne", version = "^0.2.0", default-features = false, features = ["std_tls", "eunomia"] }
eunomia = { path = "../eunomia/crates/eunomia", default-features = false }
coeus-core = { path = "../coeus/crates/coeus-core" }
coeus-tensor = { path = "../coeus/crates/coeus-tensor" }
coeus-ops = { path = "../coeus/crates/coeus-ops" }
coeus-leto = { path = "../coeus/crates/coeus-leto" }
coeus-autograd = { path = "../coeus/crates/coeus-autograd" }
leto = { path = "../leto/crates/leto", version = "0.40.0" }
leto-ops = { path = "../leto/crates/leto-ops", version = "0.40.0" }
apollo-fft = { path = "../apollo/crates/apollo-fft", version = "0.25.0" }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytemuck = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.2"
tempfile = "3.10" # For testing
proptest = "1.0"
walkdir = "2.4"
rand = "0.9"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "stream", "json", "rustls"] }
wgpu = { version = "0.20", default-features = false, features = ["wgsl"] }
pollster = "0.3"
flate2 = "1.0"
tar = "0.4"
zip = { version = "0.6", default-features = false }
indicatif = "0.17"
dirs = "5.0"
sha2 = "0.10"
hex = "0.4"
openjp2 = { version = "0.6.1", default-features = false, features = ["std"] }
zune-core = { version = "0.4", default-features = false }
zune-jpegxl = { version = "0.4", default-features = false }
mockito = "1"
eframe = "0.28"
egui = "0.28"
rfd = "0.14"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
getrandom = "0.3"
getrandom_02 = { package = "getrandom", version = "0.2" }
image = "0.24"
tiff = "0.9"

dicom-core = "0.10"
dicom-ul = "0.10"
dicom-pixeldata = { version = "0.10", default-features = false }
dicom-transfer-syntax-registry = { version = "0.10", default-features = false }
consus-hdf5 = { path = "../consus/crates/consus-hdf5", features = ["std"] }
consus-core = { path = "../consus/crates/consus-core", features = ["std"] }
consus-compression = { path = "../consus/crates/consus-compression", features = ["std", "deflate"] }
consus-io = { path = "../consus/crates/consus-io", features = ["std", "alloc"] }
consus-onnx = { path = "../consus/crates/consus-onnx", features = ["std", "alloc"] }
jpeg-decoder = "0.3"

arrayvec = "0.7"

# ── Patch sections — redirect transitive git/registry deps to local path ────
# Aequitas pulls eunomia from git; the patch below unifies it with the local
# workspace copy so that trait objects (FloatElement, NumericElement, etc.) are
# identical across the whole dependency graph.
[patch."https://github.com/ryancinsight/eunomia"]
eunomia = { path = "../eunomia/crates/eunomia" }

[patch."https://github.com/ryancinsight/eunomia.git"]
eunomia = { path = "../eunomia/crates/eunomia" }

[patch."https://github.com/ryancinsight/aequitas"]
aequitas = { path = "../aequitas" }

[patch."https://github.com/ryancinsight/Mnemosyne.git"]
mnemosyne = { path = "../mnemosyne/crates/mnemosyne" }

[patch."https://github.com/ryancinsight/themis"]
themis = { path = "../themis" }

[patch."https://github.com/ryancinsight/hermes.git"]
hermes-simd = { path = "../hermes/crates/hermes-simd" }
hermes-simd-core = { path = "../hermes/crates/hermes-simd-core" }

[patch."https://github.com/ryancinsight/Moirai.git"]
moirai = { path = "../moirai/moirai" }

# ── Profile overrides ────────────────────────────────────────────────────────
# Test builds keep `opt-level = 0` and emit line tables so that
# `STATUS_STACK_BUFFER_OVERRUN` / `STATUS_ACCESS_VIOLATION` crashes (and any
# other panics) produce source-located backtraces without duplicating full
# variable and type debug records across the generic-heavy workspace.
[profile.test]
opt-level = 0
debug = "line-tables-only"
