[workspace]
members = [
  "crates/ritk-block-matching",
  "crates/ritk-filter",
  "crates/ritk-segmentation",
  "crates/ritk-vtk",
  "crates/ritk-core",
  "crates/ritk-dicom",
  "crates/ritk-codecs",
  "crates/ritk-nifti",
  "crates/ritk-nrrd",
  "crates/ritk-metaimage",
  "crates/ritk-mgh",
  "crates/ritk-analyze",
  "crates/ritk-png",
  "crates/ritk-jpeg",
  "crates/ritk-tiff",
  "crates/ritk-minc",
  "crates/ritk-io",
  "crates/ritk-model",
  "crates/ritk-registration",
  "crates/ritk-python",
  "crates/ritk-cli",
  "crates/ritk-snap",
  "crates/ritk-transform",
  "crates/ritk-interpolation",
  "crates/ritk-spatial",
  "crates/ritk-image",
  "crates/ritk-wgpu-compat",
  "crates/ritk-morphology",
  "crates/ritk-annotation",
  "crates/ritk-tensor-ops",
  "crates/ritk-statistics",
  "crates/ritk-diffusion-scheme",
  "crates/ritk-diffusion",
  "crates/ritk-tractography",
  "crates/ritk-parcellation",
  "crates/ritk-connectome",
  "crates/ritk-trk",
  "crates/ritk-mif",
  "crates/ritk-tck",
  "crates/ritk-trx",
  "xtask",
]
resolver = "2"

[workspace.package]
license = "MIT OR Apache-2.0"
authors = ["Ryan Clanton <ryanclanton@outlook.com>"]
repository = "https://github.com/ryancinsight/ritk"
homepage = "https://ryancinsight.github.io/ritk/"
# Resolved relative to each member's own directory, so a member opting in with
# `readme.workspace = true` must carry its own `crates/<name>/README.md`.
readme = "README.md"
keywords = ["medical-imaging", "dicom", "registration", "itk", "image-processing"]
categories = [
  "science",
  "multimedia::images",
  "computer-vision",
  "science::neuroscience",
]

[workspace.dependencies]
# crates.io reserves `iris`, so the crate is published as `iris-viz`; the
# import path stays `iris` via its `[lib] name`, so no source changes.
iris = { package = "iris-viz", version = "0.1.0", git = "https://github.com/ryancinsight/iris" }
ritk-filter = { path = "crates/ritk-filter", version = "0.4.0" }
ritk-segmentation = { path = "crates/ritk-segmentation", version = "0.3.0" }
ritk-core = { path = "crates/ritk-core", version = "0.10.0" }
ritk-dicom = { path = "crates/ritk-dicom", version = "0.2.0" }
ritk-codecs = { path = "crates/ritk-codecs", version = "0.6.0" }
ritk-nifti = { path = "crates/ritk-nifti", version = "0.2.0" }
ritk-nrrd = { path = "crates/ritk-nrrd", version = "0.2.0" }
ritk-metaimage = { path = "crates/ritk-metaimage", version = "0.2.0" }
ritk-mgh = { path = "crates/ritk-mgh", version = "0.3.0" }
ritk-analyze = { path = "crates/ritk-analyze", version = "0.2.0" }
ritk-png = { path = "crates/ritk-png", version = "0.2.0" }
ritk-jpeg = { path = "crates/ritk-jpeg", version = "0.2.0" }
ritk-tiff = { path = "crates/ritk-tiff", version = "0.2.0" }
ritk-minc = { path = "crates/ritk-minc", version = "0.2.0" }
ritk-vtk = { path = "crates/ritk-vtk", version = "0.2.0" }
ritk-io = { path = "crates/ritk-io", version = "0.3.0" }
ritk-model = { path = "crates/ritk-model", version = "0.2.0" }
ritk-registration = { path = "crates/ritk-registration", version = "0.54.0" }
ritk-transform = { path = "crates/ritk-transform", version = "0.2.0" }
ritk-interpolation = { path = "crates/ritk-interpolation", version = "0.5.0" }
ritk-spatial = { path = "crates/ritk-spatial", version = "0.2.0" }
ritk-image = { path = "crates/ritk-image", version = "0.4.0" }
ritk-wgpu-compat = { path = "crates/ritk-wgpu-compat", version = "0.2.0" }
ritk-morphology = { path = "crates/ritk-morphology", version = "0.2.0" }
ritk-annotation = { path = "crates/ritk-annotation", version = "0.2.0" }
ritk-tensor-ops = { path = "crates/ritk-tensor-ops", version = "0.2.0" }
ritk-statistics = { path = "crates/ritk-statistics", version = "0.4.0" }
ritk-diffusion = { path = "crates/ritk-diffusion", version = "0.1.0" }
ritk-diffusion-scheme = { path = "crates/ritk-diffusion-scheme", version = "0.2.0" }
ritk-tractography = { path = "crates/ritk-tractography", version = "0.1.0" }
ritk-parcellation = { path = "crates/ritk-parcellation", version = "0.1.0" }
ritk-connectome = { path = "crates/ritk-connectome", version = "0.1.0" }
ritk-trk = { path = "crates/ritk-trk", version = "0.1.0" }
ritk-mif = { path = "crates/ritk-mif", version = "0.2.1" }
ritk-tck = { path = "crates/ritk-tck", version = "0.1.0" }
ritk-trx = { path = "crates/ritk-trx", version = "0.1.0" }
# The crates.io name `gaia` belongs to an unrelated third-party crate, so the
# crate is published as `gaia-mesh`; the import path stays `gaia` via its
# `[lib] name`, so no source changes.
gaia = { package = "gaia-mesh", version = "0.5.0", git = "https://github.com/ryancinsight/gaia", default-features = false }
criterion = { version = "0.5", features = ["html_reports"] }
coeus-nn = { version = "0.10.0", git = "https://github.com/ryancinsight/Coeus.git" }
coeus-optim = { version = "0.10.0", git = "https://github.com/ryancinsight/Coeus.git" }
onnx-ir = "0.20.1"
pyo3 = { version = "0.22", features = ["abi3-py39"] }
numpy = "0.22"
dicom = { version = "0.10.0", default-features = false }
moirai = { package = "moirai-runtime", version = "0.5.0", git = "https://github.com/ryancinsight/Moirai.git", features = ["melinoe"] }
# Apollo FFT scratch caches use Eunomia complex values through Mnemosyne.
mnemosyne = { package = "mnemosyne-memory", version = "0.7.0", git = "https://github.com/ryancinsight/Mnemosyne.git", rev = "15d39f3719e1d6681abd3bf9d94f9edf82afc9bc", default-features = false, features = ["std_tls", "eunomia"] }
eunomia = { version = "0.8.0", git = "https://github.com/ryancinsight/eunomia", default-features = false }
coeus-core = { version = "0.10.0", git = "https://github.com/ryancinsight/Coeus.git" }
coeus-tensor = { version = "0.10.0", git = "https://github.com/ryancinsight/Coeus.git" }
coeus-ops = { version = "0.10.0", git = "https://github.com/ryancinsight/Coeus.git" }
coeus-leto = { version = "0.10.0", git = "https://github.com/ryancinsight/Coeus.git" }
coeus-autograd = { version = "0.10.0", git = "https://github.com/ryancinsight/Coeus.git" }
leto = { version = "0.43.0", git = "https://github.com/ryancinsight/leto.git" }
leto-ops = { version = "0.43.0", git = "https://github.com/ryancinsight/leto.git" }
apollo-fft = { version = "0.27.0", git = "https://github.com/ryancinsight/apollo" }
apollo-sht = { version = "0.7.0", git = "https://github.com/ryancinsight/apollo" }
aequitas = { version = "0.2.0", git = "https://github.com/ryancinsight/aequitas" }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytemuck = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.2"
tempfile = "3.10" # For testing
proptest = "1.0"
walkdir = "2.4"
rand = "0.9"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "stream", "json", "rustls"] }
wgpu = { version = "0.20", default-features = false, features = ["wgsl"] }
pollster = "0.3"
flate2 = "1.0"
tar = "0.4"
zip = { version = "0.6", default-features = false }
indicatif = "0.17"
dirs = "5.0"
sha2 = "0.10"
hex = "0.4"
zune-core = { version = "0.4", default-features = false }
zune-jpegxl = { version = "0.4", default-features = false }
mockito = "1"
eframe = "0.28"
egui = "0.28"
rfd = "0.14"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
getrandom = "0.3"
getrandom_02 = { package = "getrandom", version = "0.2" }
image = "0.24"
base64 = "0.22"
tiff = "0.9"

dicom-core = "0.10"
dicom-ul = "0.10"
dicom-pixeldata = { version = "0.10", default-features = false }
dicom-transfer-syntax-registry = { version = "0.10", default-features = false }
consus-hdf5 = { version = "0.1.0", git = "https://github.com/ryancinsight/consus.git", features = ["std"] }
consus-core = { version = "0.1.0", git = "https://github.com/ryancinsight/consus.git", features = ["std"] }
consus-compression = { version = "0.1.0", git = "https://github.com/ryancinsight/consus.git", features = ["std", "deflate"] }
consus-io = { version = "0.1.0", git = "https://github.com/ryancinsight/consus.git", features = ["std", "alloc"] }
consus-onnx = { version = "0.1.0", git = "https://github.com/ryancinsight/consus.git", features = ["std", "alloc"] }
jpeg-decoder = "0.3"

arrayvec = "0.7"

# ── Profile overrides ────────────────────────────────────────────────────────
# Test builds keep `opt-level = 0` and emit line tables so that
# `STATUS_STACK_BUFFER_OVERRUN` / `STATUS_ACCESS_VIOLATION` crashes (and any
# other panics) produce source-located backtraces without duplicating full
# variable and type debug records across the generic-heavy workspace.
[profile.test]
opt-level = 0
debug = "line-tables-only"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }

# Pedantic floor ratchet: every class listed below already fires in this
# workspace and is allowed at its measured baseline; every class NOT listed
# is a hard error. Counts are `cargo clippy --all-targets` hits at the time
# the floor was established (total / production, production excluding
# `#[cfg(test)]` modules and test, bench and example targets). Burn a class
# down to zero, then delete its line -- the floor tightens, never loosens.

# --- Documentation debt (5875 sites, 5083 in production) ---
doc_markdown = "allow"                         # 3686 (2923 prod)
must_use_candidate = "allow"                   # 1073 (1055 prod)
missing_errors_doc = "allow"                   # 821 (821 prod)
return_self_not_must_use = "allow"             # 109 (109 prod)
unnecessary_debug_formatting = "allow"         # 97 (95 prod)
missing_panics_doc = "allow"                   # 84 (79 prod)
should_panic_without_expect = "allow"          # 4 (0 prod)
doc_comment_double_space_linebreaks = "allow"  # 1 (1 prod)

# --- Numeric conversion debt (6656 sites, 4603 in production) ---
cast_precision_loss = "allow"                  # 2183 (1030 prod)
cast_possible_truncation = "allow"             # 1301 (1083 prod)
cast_possible_wrap = "allow"                   # 1036 (926 prod)
cast_lossless = "allow"                        # 964 (744 prod)
cast_sign_loss = "allow"                       # 781 (696 prod)
float_cmp = "allow"                            # 183 (53 prod)
unreadable_literal = "allow"                   # 166 (50 prod)
manual_midpoint = "allow"                      # 23 (16 prod)
identity_op = "allow"                          # 13 (0 prod)
verbose_bit_mask = "allow"                     # 2 (2 prod)
decimal_bitwise_operands = "allow"             # 2 (1 prod)
checked_conversions = "allow"                  # 1 (1 prod)
range_plus_one = "allow"                       # 1 (1 prod)

# --- Raw-pointer / layout debt (5 sites, 5 in production) ---
ptr_as_ptr = "allow"                           # 2 (2 prod)
borrow_as_ptr = "allow"                        # 2 (2 prod)
unsafe_derive_deserialize = "allow"            # 1 (1 prod)

# --- Signature and shape debt (427 sites, 319 in production) ---
too_many_lines = "allow"                       # 138 (106 prod)
needless_pass_by_value = "allow"               # 119 (90 prod)
inline_always = "allow"                        # 59 (59 prod)
field_reassign_with_default = "allow"          # 42 (5 prod)
unnecessary_wraps = "allow"                    # 22 (21 prod)
trivially_copy_pass_by_ref = "allow"           # 12 (6 prod)
too_many_arguments = "allow"                   # 20 (18 prod)
unused_self = "allow"                          # 11 (10 prod)
struct_excessive_bools = "allow"               # 3 (3 prod)
fn_params_excessive_bools = "allow"            # 1 (1 prod)

# --- Style debt (2467 sites, 1457 in production) ---
uninlined_format_args = "allow"                # 1087 (517 prod)
similar_names = "allow"                        # 461 (343 prod)
map_unwrap_or = "allow"                        # 98 (71 prod)
many_single_char_names = "allow"               # 84 (76 prod)
explicit_iter_loop = "allow"                   # 79 (48 prod)
redundant_closure_for_method_calls = "allow"   # 80 (64 prod)
items_after_statements = "allow"               # 57 (31 prod)
cloned_instead_of_copied = "allow"             # 68 (12 prod)
match_same_arms = "allow"                      # 38 (37 prod)
assigning_clones = "allow"                     # 37 (37 prod)
default_trait_access = "allow"                 # 119 (27 prod)
manual_let_else = "allow"                      # 31 (22 prod)
case_sensitive_file_extension_comparisons = "allow" # 38 (38 prod)
single_match_else = "allow"                    # 20 (20 prod)
elidable_lifetime_names = "allow"              # 18 (18 prod)
if_not_else = "allow"                          # 14 (14 prod)
bool_to_int_with_if = "allow"                  # 14 (12 prod)
semicolon_if_nothing_returned = "allow"        # 20 (6 prod)
needless_for_each = "allow"                    # 25 (24 prod)
needless_range_loop = "allow"                  # 13 (1 prod)
no_effect_underscore_binding = "allow"         # 11 (3 prod)
index_refutable_slice = "allow"                # 8 (7 prod)
format_push_string = "allow"                   # 7 (5 prod)
wildcard_imports = "allow"                     # 10 (10 prod)
single_char_pattern = "allow"                  # 5 (1 prod)
duration_suboptimal_units = "allow"            # 3 (2 prod)
manual_assert_eq = "allow"                     # 3 (1 prod)
used_underscore_binding = "allow"              # 3 (2 prod)
manual_string_new = "allow"                    # 3 (0 prod)
implicit_clone = "allow"                       # 2 (1 prod)
ignored_unit_patterns = "allow"                # 2 (0 prod)
comparison_chain = "allow"                     # 1 (1 prod)
unnested_or_patterns = "allow"                 # 2 (2 prod)
stable_sort_primitive = "allow"                # 1 (1 prod)
manual_assert = "allow"                        # 1 (0 prod)
needless_continue = "allow"                    # 1 (1 prod)
manual_is_variant_and = "allow"                # 1 (1 prod)
needless_raw_string_hashes = "allow"           # 1 (0 prod)
option_as_ref_cloned = "allow"                 # 1 (1 prod)

# --- Restriction floor ---
# `unwrap_used` is denied outright: no workspace-wide allow. The 1599 existing
# sites (391 in production) are pinned per file by
# `#![expect(clippy::unwrap_used, reason = "ratchet RITK-UNWRAP-1")]`, which
# self-expires the moment a file's last unwrap goes.
unwrap_used = "deny"
# Library output belongs to `tracing` or the application layer. `ritk-cli` is
# the application output layer; those sites, plus example, xtask and test
# diagnostic output, carry per-file
# `#![expect(..., reason = "ratchet RITK-LINT-1")]`.
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"


